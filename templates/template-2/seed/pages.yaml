# yaml-language-server: $schema=../../schema.json
- slug: home
  title: Home
  sections:
    - hero-centered:
        badge: Now in public beta
        heading: Ship the launch, not the boilerplate.
        description: Orbit turns a product brief into a live launch page, a waitlist and a changelog in one afternoon.
        bullets:
          - { icon: zap, text: Live in minutes }
          - { icon: shield, text: Private by default }
          - { icon: users, text: Built for small teams }
        primaryButton: { type: reference, reference: "@page/home", label: Get started }
        secondaryButton: { type: custom, url: "/posts", label: Read the changelog }
        backgroundImage: "@media/hero-background.jpg"

    - logo-strip:
        heading: Trusted by teams shipping every week
        logos:
          - { name: Northwind, image: "@media/logo-northwind.jpg" }
          - { name: Halcyon, image: "@media/logo-halcyon.jpg" }
          - { name: Parallax, image: "@media/logo-parallax.jpg" }
          - { name: Quarry, image: "@media/logo-quarry.jpg" }
          - { name: Lumen, image: "@media/logo-lumen.jpg" }
          - { name: Tessera, image: "@media/logo-tessera.jpg" }

    - feature-rows:
        rows:
          - title: Write once, launch everywhere
            body: |
              Describe the product in one brief. Orbit builds the **launch page**, the social cards and the announcement email from it, and keeps them in step when the brief changes.
            image: "@media/feature-launch.jpg"
            reverse: false
          - title: A waitlist that sorts itself
            body: |
              Sign-ups arrive scored by fit, so the first invites go to the people most likely to stay. Export to any mail tool when you are ready.
            image: "@media/feature-waitlist.jpg"
            reverse: true
          - title: A changelog people read
            body: |
              Every release becomes a short, linkable note. Subscribers get a digest; the page keeps the history.
            image: "@media/feature-changelog.jpg"
            reverse: false

    - pricing:
        heading: Simple pricing, no seat maths
        plans:
          - name: Starter
            price: 0
            period: month
            features:
              - { text: One launch page }
              - { text: Waitlist up to 500 }
              - { text: Community support }
            button: { type: custom, url: "mailto:hello@example.com", label: Start free }
            highlighted: false
          - name: Team
            price: 29
            period: month
            features:
              - { text: Unlimited launch pages }
              - { text: Unlimited waitlist }
              - { text: Changelog and digests }
              - { text: Priority support }
            button: { type: custom, url: "mailto:hello@example.com", label: Start a trial }
            highlighted: true
          - name: Studio
            price: 290
            period: year
            features:
              - { text: Everything in Team }
              - { text: Five workspaces }
              - { text: Custom domain }
            button: { type: custom, url: "mailto:hello@example.com", label: Talk to us }
            highlighted: false

    - cta-band:
        heading: Your next launch is one brief away.
        text: Start on the free plan and upgrade when the waitlist outgrows it.
        button: { type: reference, reference: "@page/home", label: Get started }

    - newsletter:
        heading: Get the launch notes
        text: One short email per release. No tracking pixels, unsubscribe in one click.
        form: "@form/newsletter"
