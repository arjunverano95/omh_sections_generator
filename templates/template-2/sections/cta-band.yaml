# yaml-language-server: $schema=../../schema.json
name: cta-band
label: Call-to-action band
description: A full-width primary-colour band with a heading, a line of copy and one button.
group: Conversion
fields:
  heading:
    type: text
    required: true
  text: textarea
  button: link

layout:
  - div: bg-primary text-primary-foreground
    as: section
    children:
      - div: container flex flex-col items-start gap-6 py-16 md:flex-row md:items-center md:justify-between
        children:
          - div: flex max-w-2xl flex-col gap-3
            children:
              - text: heading
                as: h2
                variant: heading.section
              - text: text
                class: text-lg text-primary-foreground/80
          - button: button
            class: inline-flex items-center justify-center rounded-sm bg-primary-foreground px-6 py-3 font-semibold text-primary transition hover:opacity-90
