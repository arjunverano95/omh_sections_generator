# yaml-language-server: $schema=../schema.json
kind: global
name: footer
fields:
  columns:
    type: array
    max: 4
    rowLabel: heading
    fields:
      heading: text
      links:
        type: array
        rowLabel: link
        fields:
          link: link
  note: textarea
  social:
    type: array
    rowLabel: icon
    fields:
      icon:
        type: icon
        required: true
      link:
        type: link
        required: true

layout:
  - div: mt-auto border-t border-border bg-muted/40
    as: footer
    children:
      - each: columns
        as: div
        class: container grid gap-10 py-14 sm:grid-cols-2 lg:grid-cols-4
        children:
          - div: flex flex-col gap-3
            children:
              - text: heading
                as: h2
                variant: text.eyebrow
              - each: links
                as: ul
                class: flex flex-col gap-2
                children:
                  - div: flex
                    as: li
                    children:
                      - button: link
                        variant: button.link
      - div: container flex flex-col gap-4 border-t border-border py-6 md:flex-row md:items-center md:justify-between
        children:
          - text: note
            as: small
            class: text-sm text-muted-foreground
          - each: social
            as: ul
            class: flex items-center gap-4
            children:
              - div: flex
                as: li
                children:
                  - button: link
                    class: text-muted-foreground transition-colors hover:text-foreground
                    children:
                      - icon: icon
                        size: 20
