# yaml-language-server: $schema=../schema.json
header:
  logo: "@media/logo.svg"
  navItems:
    - link: { type: reference, reference: "@page/home", label: Work }
    - link: { type: reference, reference: "@page/about", label: About }
    - link: { type: custom, url: /posts, label: Journal }
    - link: { type: reference, reference: "@page/contact", label: Contact }
  cta: { type: reference, reference: "@page/contact", label: Start a project }

footer:
  columns:
    - heading: Studio
      links:
        - link: { type: reference, reference: "@page/home", label: Work }
        - link: { type: reference, reference: "@page/about", label: About }
        - link: { type: reference, reference: "@page/contact", label: Contact }
    - heading: Journal
      links:
        - link: { type: custom, url: /posts, label: All posts }
        - link: { type: custom, url: /search, label: Search }
    - heading: Elsewhere
      links:
        - link: { type: custom, url: /admin, label: Admin }
  note: Studio is the demo site of the sections engine. Every word and pixel on this page comes from configuration.
  social:
    - icon: mail
      link: { type: custom, url: "mailto:hello@example.com", label: Email }
    - icon: rss
      link: { type: custom, url: /posts, label: Journal }
    - icon: globe
      link: { type: custom, url: "https://example.com", label: Website, newTab: true }
