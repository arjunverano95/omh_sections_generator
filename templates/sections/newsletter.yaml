# yaml-language-server: $schema=../schema.json
name: newsletter
label: Newsletter
description: A compact centred sign-up form with a heading and a line of copy.
group: Conversion

fields:
  heading: text
  text: textarea
  form:
    type: form
    required: true

layout:
  - div: container flex flex-col items-center gap-4 py-20 text-center md:py-28
    as: section
    children:
      - text: heading
        as: h2
        variant: heading.section
        if: heading
      - text: text
        variant: text.lead
        class: max-w-xl
        if: text
      - form: form
        class: w-full max-w-md pt-2 text-left
