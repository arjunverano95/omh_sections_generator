# yaml-language-server: $schema=../../../../../../templates/schema.json
name: hero
label: Hero
fields:
  heading:
    type: text
    required: true
  featured: checkbox
layout:
  - div: container py-16
    as: section
    children:
      - text: heading
        as: h1
        variant: heading.title
        if: { field: featured, equals: "yes" }
